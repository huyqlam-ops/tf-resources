name: Terraform Plan (Pull Request)

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.tf'
      - '.github/workflows/terraform-*.yml'

permissions:
  contents: read
  pull-requests: write   # để bot comment plan output lên PR
  id-token: write        # cho Azure OIDC login

env:
  TF_IN_AUTOMATION: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    environment:
      name: dev # đổi lại nếu code tf không nằm trong thư mục này

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: true

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true

      - name: Save plan output for comment
        if: always()
        run: terraform show -no-color tfplan > plan_output.txt

      - name: Comment plan result on PR
        uses: actions/github-script@v7
        if: always()
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = 'terraform/plan_output.txt';
            let planText = '';
            try {
              planText = fs.readFileSync(path, 'utf8');
            } catch (e) {
              planText = 'Không đọc được plan output.';
            }
            // Giới hạn độ dài comment tránh vượt limit của GitHub
            const maxLen = 60000;
            if (planText.length > maxLen) {
              planText = planText.substring(0, maxLen) + '\n\n... (đã cắt bớt, xem chi tiết trong log của job)';
            }

            const body = `#### Terraform Format 🖌 \`${{ env.FMT_OUTCOME }}\`
            #### Terraform Plan 📖 \`${{ env.PLAN_OUTCOME }}\`

            <details><summary>Xem chi tiết Plan</summary>

            \`\`\`terraform
            ${planText}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1